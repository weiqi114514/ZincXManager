# 用 JDK 21 编译（NeoForge 1.21.1 要求；PATH 里的 java 是 26，Gradle 8.10 跑不了）
org.gradle.java.home=G:/jdk21
org.gradle.jvmargs=-Xmx2G

# ------------------------------------------------------------------
# maven.neoforged.net 在你的网络下连不上（DNS 被污染 + 超时），
# 而它上面的 net.neoforged:neoform-runtime 国内所有镜像都没有，
# 所以第一次 build 会卡在 :createMinecraftArtifacts。
# 有代理/VPN 时把下面四行的 # 去掉、填上代理地址，再跑 gradlew build。
# ------------------------------------------------------------------
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
