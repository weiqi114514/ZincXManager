<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="四端架构:ZXMC 连 ZXMS(21000),ZXMS 连 ZXMOS(25000),ZXMS 经 21200 指挥 ZXMM">
